[package]
name = "codex-receipts"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Turn local Codex sessions into text and print-ready HTML receipts"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
